name: Ubuntu Test Runner

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: ubuntu-22.04
    timeout-minutes: 350   # حداکثر واقعی گیت‌هاب ۳۶۰ دقیقه (۶ ساعت) است

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailnet
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$(date +%s)

      - name: Show Tailscale IP
        run: |
          sudo tailscale ip -4

      - name: Enable root login with password
        run: |
          # پسورد ثابت روت - همینو برای اتصال استفاده کن
          ROOT_PASS="Test1234!"
          echo "root:${ROOT_PASS}" | sudo chpasswd
          sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl enable ssh
          sudo systemctl restart ssh
          echo "=================================="
          echo "Root password is: ${ROOT_PASS}"
          echo "=================================="

      - name: Install 3x-ui panel
        run: |
          bash <(curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh) v3.6.0

      - name: Keep runner alive
        run: |
          echo "Runner is up. Connect via: ssh root@<tailscale-ip>"
          echo "Password was printed in the previous step."
          # نگه‌داشتن Job زنده تا نزدیک سقف ۶ ساعته
          sleep 20000
